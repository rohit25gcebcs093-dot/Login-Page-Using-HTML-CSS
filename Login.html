<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=content-width" intial-scale="1.0">
        <title>Login Page</title>
        <link rel="stylesheet" href="./Login.css">
    </head>
    <body>

        <div class="box">
            <form>
                <h1>Login</h1>
                <div>
                    <label for="username" style="display: block;">Username</label>
                    <input type="text" id="username" placeholder="Enter your name:" style="display: block;">
                </div>

                <div>
                    <label for="password" style="display: block;">Password</label>
                    <input type="text" id="password" placeholder="Enter your password:" style="display: block ;">
                </div>

                <button style="width: 100%; height: 30px; font-size: 100%; background-color: rgb(131, 131, 202); color: white; font-weight: 600; padding: 5px;">Login</button>
            </form>
        </div>
    </body>

</html>
